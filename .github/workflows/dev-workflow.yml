name: Terraform Dev Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # 3. Debug GitHub OIDC token
      - name: Debug OIDC
        uses: github/actions-oidc-debugger@main

      # 4. Configure AWS using GitHub OIDC
      - name: AWS Access using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::713881819579:role/github-oidc-vcube
          role-session-name: github-actions
          aws-region: ap-south-1
          retry-max-attempts: 1

      # 5. Check AWS identity
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # 6. Terraform init
      - name: Terraform Init
        run: terraform init

      # 7. Terraform validate
      - name: Terraform Validate
        run: terraform validate

      # 8. Terraform plan
      - name: Terraform Plan
        run: terraform plan -var-file=dev.tfvars


  apply:
    runs-on: ubuntu-latest

    needs: plan

    defaults:
      run:
        working-directory: dev

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # 3. Configure AWS using GitHub OIDC
      - name: AWS Access using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::713881819579:role/github-oidc-vcube
          role-session-name: github-actions
          aws-region: ap-south-1
          retry-max-attempts: 1

      # 4. Check AWS identity
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # 5. Terraform init
      - name: Terraform Init
        run: terraform init

      # 6. Terraform apply
      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=dev.tfvars
